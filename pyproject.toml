[project]
name = "ha-hungarian-power"
version = "0.1.0"
description = "Home Assistant custom integration for Hungarian power-system data"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4",
    "openpyxl>=3.1.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

